# $HOME/.config/hypr/hyprlock.conf
# Catppuccin Mocha Hyprlock Theme

source = $HOME/.config/hypr/colors/mocha.conf

background {
    monitor =
    color = $base
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    hide_input = false
    check_color = $mauve
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $yellow
    position = 0, -50
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $text
    font_size = 64
    font_family = JetBrainsMono Nerd Font Propo Bold
    position = 0, 120
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = $subtext0
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 40
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Hi there, $USER
    color = $subtext1
    font_size = 14
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -120
    halign = center
    valign = center
}
