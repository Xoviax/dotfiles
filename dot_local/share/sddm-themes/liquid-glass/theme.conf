[General]
# macOS Sequoia Liquid Glass Theme Configuration
# Background wallpaper path (relative to theme root)
Background="Backgrounds/current-wallpaper.jpg"

# Typography (Apple SF Pro style, Inter recommended)
Font="Inter"
FontSize="14"

# Clock and Date formatting
HourFormat="HH:mm"
DateFormat="dddd, MMMM d"

# Primary Display targeting (DP-3 is 2560x1440)
PrimaryScreenWidth="2560"
PrimaryScreenHeight="1440"

# Frosted Glass Card geometry & styling
CardRadius="28"
BlurMax="64"
Blur="1.0"

# User settings
DefaultUser="xoviax"
ForceLastUser="true"
HideCompletePassword="true"

# System controls
ShowSleepButton="true"
ShowRestartButton="true"
ShowShutdownButton="true"
